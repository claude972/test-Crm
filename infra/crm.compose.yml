name: hermes-crm-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hermes_crm
      POSTGRES_DB: hermes_crm_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local-project setup first}
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hermes_crm -d hermes_crm_dev]
      interval: 5s
      retries: 20
  redis:
    image: redis:7
    command: [redis-server, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6388:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20

volumes:
  db-data:
