# Include explicitly with the base Compose AND --profile mail-fixture. Default base deployment stays OFF.
services:
  mail-fixture:
    profiles: [mail-fixture]
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    user: '${KOVAALABCRM_MAIL_FIXTURE_UID:?}:${KOVAALABCRM_MAIL_FIXTURE_GID:?}'
    env_file:
      - {path: '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/provider.env', format: raw}
    volumes:
      - '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/server.p12:/fixture/server.p12:ro'
    networks:
      mail-fixture:
        aliases: ['${KOVAALABCRM_MAIL_FIXTURE_HOST:?}']
    labels:
      kovaalabcrm.fixture.mode: isolated-capture-only
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    mem_limit: 256m
    cpus: 0.5
    restart: 'no'
  mail-fixture-expiry:
    profiles: [mail-fixture]
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    user: '${KOVAALABCRM_MAIL_FIXTURE_UID:?}:${KOVAALABCRM_MAIL_FIXTURE_GID:?}'
    pid: service:mail-fixture
    network_mode: none
    env_file:
      - {path: '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/expiry.env', format: raw}
    volumes:
      - '${KOVAALABCRM_MAIL_FIXTURE_SCRIPTS_DIR:?}:/fixture-code:ro'
    entrypoint: [node, /fixture-code/expiry.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.1
    restart: 'no'
    depends_on: {mail-fixture: {condition: service_started}}
  server:
    networks: [data, edge, mail-fixture]
    env_file:
      - {path: '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/application.env', format: raw}
    volumes:
      - '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/ca.pem:/opt/kovaalabcrm-fixture/ca.pem:ro'
  worker:
    networks: [data, edge, mail-fixture]
    env_file:
      - {path: '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/application.env', format: raw}
    volumes:
      - '${KOVAALABCRM_MAIL_FIXTURE_PRIVATE_DIR:?}/ca.pem:/opt/kovaalabcrm-fixture/ca.pem:ro'
networks:
  mail-fixture:
    name: kovaalabcrm-staging-mail-fixture
    internal: true
