<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/hermes-icon.svg"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/hermes-icon-180.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

    <meta name="theme-color" content="#0073ea" />
    <meta name="description" content="Clients, prospection et suivi commercial." />
    <meta
      property="og:image"
      content="/hermes-icon-512.png"
    />
    <meta property="og:description" content="Clients, prospection et suivi commercial." />
    <meta property="og:title" content="Hermès CRM" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="/hermes-icon-512.png"
    />

    <meta name="twitter:description" content="Clients, prospection et suivi commercial." />
    <meta name="twitter:title" content="Hermès CRM" />
    <title>Hermès CRM</title>
    <!-- BEGIN: KovaaLab CRM Config -->
    <script id="kovaa-lab-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: KovaaLab CRM Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      /* react-data-grid declares its layer when it loads; keep it below kovaa-lab-ui. */
      @layer rdg, kovaa-lab-ui;

      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
