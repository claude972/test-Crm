name: Spawn KovaaLab CRM App Dev Test
description: >
  Starts a KovaaLab CRM all-in-one test instance (server, worker, database, redis)
  using the twentycrm/kovaa-lab-app-dev Docker image on port 2021.
  The server is available at http://localhost:2021 with seeded demo data.

inputs:
  kovaa-lab-version:
    description: 'KovaaLab CRM Docker Hub image tag for kovaa-lab-app-dev (e.g., "latest" or "v1.20.0").'
    required: false
    default: 'latest'

outputs:
  server-url:
    description: 'URL where the KovaaLab CRM test server can be reached'
    value: http://localhost:2021
  api-key:
    description: 'ACCESS token for the seeded KovaaLab CRM dev admin (Tim)'
    value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..Ow8z-Dptg4LDiO2nApu5UQcX2a-gXdu_McalWs7Pgt8

runs:
  using: 'composite'
  steps:
    - name: Start kovaa-lab-app-dev-test container
      shell: bash
      run: |
        docker run -d \
          --name kovaa-lab-app-dev-test \
          -p 2021:2021 \
          -e NODE_PORT=2021 \
          -e SERVER_URL=http://localhost:2021 \
          -e MARKETPLACE_CATALOG_SYNC_CRON_ENABLED=false \
          -e API_RATE_LIMITING_SHORT_LIMIT=100000 \
          -e API_RATE_LIMITING_LONG_LIMIT=100000 \
          twentycrm/kovaa-lab-app-dev:${{ inputs.kovaa-lab-version }}

        echo "Waiting for KovaaLab CRM test instance to become healthy…"
        TIMEOUT=180
        ELAPSED=0
        until curl -sf http://localhost:2021/healthz > /dev/null 2>&1; do
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "::error::KovaaLab CRM did not become healthy within ${TIMEOUT}s"
            docker logs kovaa-lab-app-dev-test 2>&1 | tail -80
            exit 1
          fi
          sleep 3
          ELAPSED=$((ELAPSED + 3))
          echo "  … waited ${ELAPSED}s"
        done
        echo "KovaaLab CRM test instance is ready at http://localhost:2021 (took ~${ELAPSED}s)"
