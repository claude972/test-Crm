name: P0 backend build
on:
  push:
    branches: [fix/codex-backend-build]
    paths:
      - '.github/workflows/p0-backend-build.yml'
      - 'apps/crm/ui/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      hermes-integration:
        type: boolean
        default: false
      hermes-checks:
        type: boolean
        default: false
      runtime-smoke:
        type: boolean
        default: false
      browser-smoke:
        type: boolean
        default: false
      frontend-artifact:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: p0-backend-build-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'feat/codex-hermes-integration' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ inputs.runtime-smoke && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: p0_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p0_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: ${{ inputs.runtime-smoke && 'redis:7' || '' }}
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORCE_COLOR: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: apps/crm/ui
    steps:
      - uses: actions/checkout@v4
      - name: Validate the requested browser checkpoint
        if: ${{ inputs.browser-smoke }}
        env:
          P0_RUNTIME_SMOKE: ${{ inputs.runtime-smoke }}
          P0_FRONTEND_ARTIFACT: ${{ inputs.frontend-artifact }}
        run: test "$P0_RUNTIME_SMOKE" = true && test -n "$P0_FRONTEND_ARTIFACT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install immutable workspace dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Build shared runtime and declarations
        id: shared_build
        working-directory: apps/crm/ui/packages/twenty-shared
        run: |
          node --input-type=module -e "const { build } = await import('vite'); await build();"
          node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --noEmit false --outDir dist --rootDir src --singleThreaded
          node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
          test -s dist/index.cjs
          test -s dist/application/index.d.ts
      - name: Build client SDK runtime and declarations
        id: sdk_build
        working-directory: apps/crm/ui/packages/twenty-client-sdk
        env:
          NODE_ENV: production
        run: |
          node --input-type=module -e "const { build } = await import('vite'); await build(); await build({ configFile: 'vite.metadata.config.ts' });"
          node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --noEmit false --outDir dist --rootDir src --singleThreaded
          node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
          test -s dist/core.cjs
          test -s dist/metadata.mjs
          test -s dist/core/index.d.ts
      - name: Verify generated client authentication and upload behavior
        id: sdk_tests
        working-directory: apps/crm/ui/packages/twenty-client-sdk
        run: node ../../node_modules/vitest/vitest.mjs run src/generate/__tests__/client-wrapper-auth.test.ts src/generate/__tests__/client-wrapper-upload-file.test.ts src/generate/__tests__/stub-generated-client-drift.test.ts --maxWorkers=2
      - name: Build email runtime and declarations without sending mail
        id: email_build
        if: ${{ !cancelled() && steps.sdk_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-emails
        run: |
          node --input-type=module -e "const { build } = await import('vite'); await build();"
          node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --outDir dist --rootDir src --composite false --singleThreaded
          node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
          test -s dist/index.js
          test -s dist/index.d.ts
      - name: Remove committed environment fixtures from the disposable Hermes job
        if: ${{ inputs.hermes-checks }}
        working-directory: .
        run: |
          set -eu
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git ls-files --error-unmatch apps/crm/ui/packages/twenty-server/.env.test apps/crm/ui/packages/twenty-server/.env.e2e-testing-server >/dev/null
          git diff --quiet HEAD -- apps/crm/ui/packages/twenty-server/.env.test apps/crm/ui/packages/twenty-server/.env.e2e-testing-server
          rm -- apps/crm/ui/packages/twenty-server/.env.test apps/crm/ui/packages/twenty-server/.env.e2e-testing-server
      - name: Verify Hermes tenant, prospection and SMTP regressions
        if: ${{ inputs.hermes-checks && steps.sdk_build.outcome == 'success' && steps.email_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-server
        run: node ../../node_modules/jest/bin/jest.js --config jest.config.mjs --runInBand --cacheDirectory /tmp/hermes-jest-cache --runTestsByPath src/engine/core-modules/workspace/structure-dashboard/__tests__/structure-dashboard.service.spec.ts src/engine/core-modules/hermes-prospection/__tests__/hermes-prospection-access.service.spec.ts src/engine/core-modules/hermes-prospection/__tests__/hermes-prospection.service.spec.ts src/engine/core-modules/hermes-prospection/__tests__/hermes-prospection-review.spec.ts src/engine/core-modules/hermes-prospection/utils/__tests__/hermes-import-policy.spec.ts src/engine/core-modules/emailing-domain/drivers/smtp/__tests__/smtp-emailing-domain-driver.spec.ts src/engine/core-modules/emailing-domain/utils/__tests__/get-sole-envelope-recipient.util.spec.ts src/engine/core-modules/emailing-domain/services/__tests__/unsubscribe-content.service.spec.ts src/engine/core-modules/hermes-connectors/evolution/__tests__/evolution-connection.adapter.spec.ts src/engine/core-modules/hermes-connectors/__tests__/hermes-connectors.resolver.spec.ts src/engine/core-modules/hermes-connectors/__tests__/hermes-connectors.service.spec.ts src/modules/emailing/services/__tests__/campaign-unconfirmed-quarantine.spec.ts src/modules/emailing/services/__tests__/emailing-domain-sender-quarantine.spec.ts src/modules/emailing/utils/__tests__/resolve-campaign-batch-settlements.util.spec.ts src/modules/emailing/utils/__tests__/resolve-campaign-send-failure.util.spec.ts
      - name: Typecheck backend production sources without starting the server
        id: backend_types
        if: ${{ !cancelled() && steps.sdk_build.outcome == 'success' && steps.email_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-server
        run: node ../../node_modules/.bin/tsgo -p tsconfig.build.json --noEmit --singleThreaded
      - name: Compile backend and verify executable artifacts without running them
        id: backend_build
        if: ${{ !cancelled() && steps.sdk_build.outcome == 'success' && steps.email_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-server
        run: |
          node ../../node_modules/.bin/nest build --path ./tsconfig.build.json
          test -s dist/main.js
          test -s dist/queue-worker/queue-worker.js
          mkdir -p dist/assets/kovaa-lab-client-sdk
          cp ../twenty-client-sdk/package.json dist/assets/kovaa-lab-client-sdk/
          cp -r ../twenty-client-sdk/dist dist/assets/kovaa-lab-client-sdk/dist
          test -s dist/assets/kovaa-lab-client-sdk/dist/core.cjs
          test -s dist/assets/kovaa-lab-client-sdk/dist/metadata/index.d.ts
      - name: Verify disposable migration guards
        if: ${{ inputs.hermes-checks }}
        working-directory: .
        run: node --test scripts/check-hermes-migration-ci.test.mjs scripts/check-hermes-integration-p0.test.mjs scripts/check-hermes-swc-isolation.test.mjs
      - name: Generate or verify the registered Hermes migration on disposable PostgreSQL
        if: ${{ inputs.hermes-checks && inputs.runtime-smoke && steps.backend_types.outcome == 'success' && steps.backend_build.outcome == 'success' }}
        working-directory: .
        env:
          PG_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/p0_ci
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          if compgen -G 'apps/crm/ui/packages/twenty-server/src/database/commands/upgrade-version-command/2-52/*-add-hermes-import-state.ts' > /dev/null; then
            node scripts/check-hermes-migration-ci.mjs --verify-existing --reset-after-check
          else
            node scripts/check-hermes-migration-ci.mjs --generate --reset-after-generation
          fi
      - name: Publish generated Hermes migration for review
        if: ${{ always() && inputs.hermes-checks }}
        uses: actions/upload-artifact@v4
        with:
          name: hermes-migration-${{ github.sha }}
          path: hermes-migration-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Download the exact frontend build for browser verification
        if: ${{ inputs.browser-smoke }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend-artifact }}
          path: apps/crm/ui/packages/twenty-front/build
      - name: Install Chromium for the disposable browser check
        if: ${{ inputs.browser-smoke }}
        run: node .yarn/releases/yarn-4.18.1.cjs workspace kovaa-lab-front exec playwright install --with-deps chromium
      - name: Verify backend startup and client configuration against disposable services
        if: ${{ inputs.runtime-smoke && steps.backend_types.outcome == 'success' && steps.backend_build.outcome == 'success' }}
        working-directory: .
        env:
          PG_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/p0_ci
          REDIS_URL: redis://127.0.0.1:6379
          P0_BROWSER_SMOKE: ${{ inputs.browser-smoke }}
          P1_HERMES_BROWSER_SMOKE: ${{ inputs.hermes-checks && 'true' || 'false' }}
        run: node scripts/check-backend-runtime-p0.mjs
      - name: Verify registered Hermes APIs against fresh native fixtures
        if: ${{ inputs.hermes-integration && inputs.hermes-checks && hashFiles('apps/crm/ui/packages/twenty-server/src/database/commands/upgrade-version-command/2-52/*-add-hermes-import-state.ts') != '' }}
        working-directory: .
        env:
          PG_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/p0_ci
          REDIS_URL: redis://127.0.0.1:6379
          P0_INTEGRATION_DISPOSABLE: 'true'
        run: node scripts/check-hermes-integration-p0.mjs test/integration/graphql/suites/hermes-structure-dashboard.integration-spec.ts test/integration/graphql/suites/hermes-prospection.integration-spec.ts
      - name: Publish browser evidence
        if: ${{ !cancelled() && inputs.browser-smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-browser-${{ github.sha }}
          path: p0-browser-artifacts
          if-no-files-found: warn
          retention-days: 7
