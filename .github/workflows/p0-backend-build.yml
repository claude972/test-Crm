name: P0 backend build
on:
  push:
    branches: [fix/codex-backend-build]
    paths:
      - '.github/workflows/p0-backend-build.yml'
      - 'apps/crm/ui/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      runtime-smoke:
        type: boolean
        default: false
      browser-smoke:
        type: boolean
        default: false
      frontend-artifact:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: p0-backend-build-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ inputs.runtime-smoke && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: p0_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p0_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: ${{ inputs.runtime-smoke && 'redis:7' || '' }}
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORCE_COLOR: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        working-directory: apps/crm/ui
    steps:
      - uses: actions/checkout@v4
      - name: Validate the requested browser checkpoint
        if: ${{ inputs.browser-smoke }}
        env:
          P0_RUNTIME_SMOKE: ${{ inputs.runtime-smoke }}
          P0_FRONTEND_ARTIFACT: ${{ inputs.frontend-artifact }}
        run: test "$P0_RUNTIME_SMOKE" = true && test -n "$P0_FRONTEND_ARTIFACT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install immutable workspace dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Build shared runtime and declarations
        id: shared_build
        working-directory: apps/crm/ui/packages/twenty-shared
        run: |
          node --input-type=module -e "const { build } = await import('vite'); await build();"
          node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --noEmit false --outDir dist --rootDir src --singleThreaded
          node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
          test -s dist/index.cjs
          test -s dist/application/index.d.ts
      - name: Build client SDK runtime and declarations
        id: sdk_build
        working-directory: apps/crm/ui/packages/twenty-client-sdk
        env:
          NODE_ENV: production
        run: |
          node --input-type=module -e "const { build } = await import('vite'); await build(); await build({ configFile: 'vite.metadata.config.ts' });"
          node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --noEmit false --outDir dist --rootDir src --singleThreaded
          node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
          test -s dist/core.cjs
          test -s dist/metadata.mjs
          test -s dist/core/index.d.ts
      - name: Verify generated client authentication and upload behavior
        id: sdk_tests
        working-directory: apps/crm/ui/packages/twenty-client-sdk
        run: node ../../node_modules/vitest/vitest.mjs run src/generate/__tests__/client-wrapper-auth.test.ts src/generate/__tests__/client-wrapper-upload-file.test.ts src/generate/__tests__/stub-generated-client-drift.test.ts --maxWorkers=2
      - name: Build email runtime and declarations without sending mail
        id: email_build
        if: ${{ !cancelled() && steps.sdk_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-emails
        run: |
          node --input-type=module -e "const { build } = await import('vite'); await build();"
          node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --outDir dist --rootDir src --composite false --singleThreaded
          node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
          test -s dist/index.js
          test -s dist/index.d.ts
      - name: Typecheck backend production sources without starting the server
        id: backend_types
        if: ${{ !cancelled() && steps.sdk_build.outcome == 'success' && steps.email_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-server
        run: node ../../node_modules/.bin/tsgo -p tsconfig.build.json --noEmit --singleThreaded
      - name: Compile backend and verify executable artifacts without running them
        id: backend_build
        if: ${{ !cancelled() && steps.sdk_build.outcome == 'success' && steps.email_build.outcome == 'success' }}
        working-directory: apps/crm/ui/packages/twenty-server
        run: |
          node ../../node_modules/.bin/nest build --path ./tsconfig.build.json
          test -s dist/main.js
          test -s dist/queue-worker/queue-worker.js
          mkdir -p dist/assets/kovaa-lab-client-sdk
          cp ../twenty-client-sdk/package.json dist/assets/kovaa-lab-client-sdk/
          cp -r ../twenty-client-sdk/dist dist/assets/kovaa-lab-client-sdk/dist
          test -s dist/assets/kovaa-lab-client-sdk/dist/core.cjs
          test -s dist/assets/kovaa-lab-client-sdk/dist/metadata/index.d.ts
      - name: Download the exact frontend build for browser verification
        if: ${{ inputs.browser-smoke }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.frontend-artifact }}
          path: apps/crm/ui/packages/twenty-front/build
      - name: Install Chromium for the disposable browser check
        if: ${{ inputs.browser-smoke }}
        run: node .yarn/releases/yarn-4.18.1.cjs workspace kovaa-lab-front exec playwright install --with-deps chromium
      - name: Verify backend startup and client configuration against disposable services
        if: ${{ inputs.runtime-smoke && steps.backend_types.outcome == 'success' && steps.backend_build.outcome == 'success' }}
        working-directory: .
        env:
          PG_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/p0_ci
          REDIS_URL: redis://127.0.0.1:6379
          P0_BROWSER_SMOKE: ${{ inputs.browser-smoke }}
        run: node scripts/check-backend-runtime-p0.mjs
      - name: Publish browser evidence
        if: ${{ !cancelled() && inputs.browser-smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-browser-${{ github.sha }}
          path: p0-browser-artifacts
          if-no-files-found: warn
          retention-days: 7
