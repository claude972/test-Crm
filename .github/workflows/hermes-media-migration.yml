name: Hermes media migration
on:
  push:
    branches: [feat/codex-hermes-v4-media]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hermes-media-migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: p0_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d p0_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["127.0.0.1:6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORCE_COLOR: "0"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: baece3a46a6286a933cfc99b22a53ac50c34e498
          path: .media-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install immutable workspace dependencies
        working-directory: apps/crm/ui
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Build shared, client SDK and email dependencies without provider traffic
        working-directory: apps/crm/ui
        run: |
          set -eu
          for package in twenty-shared twenty-client-sdk twenty-emails; do
            (
              cd "packages/$package"
              node --input-type=module -e "const { build } = await import('vite'); await build();"
              if test "$package" = twenty-client-sdk; then
                node --input-type=module -e "const { build } = await import('vite'); await build({ configFile: 'vite.metadata.config.ts' });"
              fi
              node ../../node_modules/.bin/tsgo -p tsconfig.lib.json --declaration --emitDeclarationOnly --noEmit false --outDir dist --rootDir src --composite false --singleThreaded
              node ../../node_modules/tsc-alias/dist/bin/index.js -p tsconfig.lib.json --outDir dist
            )
          done
      - name: Typecheck and compile feature production sources
        working-directory: apps/crm/ui/packages/twenty-server
        run: |
          node ../../node_modules/.bin/tsgo -p tsconfig.build.json --noEmit --singleThreaded
          node ../../node_modules/.bin/nest build --path ./tsconfig.build.json
      - name: Compile exact baseline using the installed dependency tree
        run: |
          set -eu
          test "$(git -C .media-baseline rev-parse HEAD)" = baece3a46a6286a933cfc99b22a53ac50c34e498
          ln -s "$GITHUB_WORKSPACE/apps/crm/ui/node_modules" .media-baseline/apps/crm/ui/node_modules
          cd .media-baseline/apps/crm/ui/packages/twenty-server
          node ../../node_modules/.bin/nest build --path ./tsconfig.build.json
      - name: Remove only tracked test environment fixtures from disposable checkouts
        run: |
          set -eu
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for checkout in . .media-baseline; do
            git -C "$checkout" ls-files --error-unmatch apps/crm/ui/packages/twenty-server/.env.test apps/crm/ui/packages/twenty-server/.env.e2e-testing-server >/dev/null
            git -C "$checkout" diff --quiet HEAD -- apps/crm/ui/packages/twenty-server/.env.test apps/crm/ui/packages/twenty-server/.env.e2e-testing-server
            rm -- "$checkout/apps/crm/ui/packages/twenty-server/.env.test" "$checkout/apps/crm/ui/packages/twenty-server/.env.e2e-testing-server"
          done
      - name: Verify media and messaging regressions with disposable HTTP providers
        working-directory: apps/crm/ui/packages/twenty-server
        run: |
          mapfile -t suites < <(find src/engine/core-modules/hermes-media/__tests__ src/engine/core-modules/hermes-messaging/__tests__ src/engine/core-modules/hermes-connectors/evolution/messages/__tests__ -name '*.spec.ts' -type f | sort)
          node ../../node_modules/jest/bin/jest.js --config jest.config.mjs --runInBand --runTestsByPath "${suites[@]}"
      - name: Generate native 2.52 command and prove PostgreSQL up/down/up schema convergence
        env:
          PG_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/p0_ci
          REDIS_URL: redis://127.0.0.1:6379
        run: node scripts/check-hermes-media-migration-ci.mjs
      - name: Publish exact migration patch and verification evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-media-migration-${{ github.sha }}
          path: hermes-media-migration-artifacts
          if-no-files-found: warn
          retention-days: 7
