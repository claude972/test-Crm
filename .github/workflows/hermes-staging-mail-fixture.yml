name: kovaalabcrm isolated fake mail acceptance
on:
  push:
    branches: ['fix/hermes-autonomous-recovery-20261031']
    paths:
      - 'infra/hermes-staging/mail-fixture/**'
      - 'scripts/check-hermes-staging-mail-fixture*.mjs'
      - '.github/workflows/hermes-staging-mail-fixture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kovaalabcrm-isolated-mail-acceptance
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HERMES_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fixture configuration and certificate boundaries
        run: node --test scripts/check-hermes-staging-mail-fixture.test.mjs
      - name: Exercise only the disposable fake provider without rebuilding the CRM
        run: |
          export HERMES_STAGING_MAIL_REPORT_FILE="$RUNNER_TEMP/kovaalabcrm-mail-evidence/result.json"
          mkdir -p "$(dirname "$HERMES_STAGING_MAIL_REPORT_FILE")"
          node scripts/check-hermes-staging-mail-fixture.mjs
      - name: Preserve non-secret protocol and cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kovaalabcrm-isolated-mail-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/kovaalabcrm-mail-evidence/
          if-no-files-found: ignore
          retention-days: 3
