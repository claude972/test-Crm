name: Auto-Draft External PRs

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  dispatch:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint kovaa-lab-factory dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TWENTY_WORKFLOW_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.TWENTY_WORKFLOW_DISPATCHER_PRIVATE_KEY }}
          owner: kovaa-lab
          repositories: kovaa-lab-factory
          permission-actions: write

      - name: Dispatch to kovaa-lab-factory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run convert-pr-to-draft.yaml --repo kovaa-lab/kovaa-lab-factory --ref main \
            -f pr_number="$PR_NUMBER"
